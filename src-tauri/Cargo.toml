[package]
name = "sindry"
version = "2.0.5"
description = "Outil de maintenance Windows"
authors = ["Buly"]
edition = "2021"
# Deux binaires : l'application (sindry.exe) et sa ligne de commande
# (sindry-cli.exe, installee sous le nom sindry.com). Tauri prend celui-ci
# pour l'application.
default-run = "sindry"

[lib]
# Le suffixe _lib est necessaire sous Windows pour que le nom de la bibliotheque
# n'entre pas en conflit avec celui du binaire. Voir rust-lang/cargo#8519.
name = "sindry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sindry"
path = "src/main.rs"
# Aucun test ici : toute la logique vit dans la bibliotheque, qui se teste
# sans lancer l'application. Le binaire, lui, ouvre une fenetre — le harnais
# de test n'en ferait rien.
test = false

# La ligne de commande (2.0, specification §19) : un programme console, que
# l'installeur pose a cote de sindry.exe sous le nom sindry.com (ordre de
# PATHEXT : « sindry » dans une console le trouve en premier).
[[bin]]
name = "sindry-cli"
path = "src/bin/sindry-cli.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Empreinte du contenu des scripts : identification des modifications et base
# de l'approbation avant premiere execution (specification 12.1).
sha2 = "0.10"
# Horodatage local des journaux. Deja present dans l'arbre de dependances de
# Tauri : l'ajouter en direct ne coute pas de compilation supplementaire.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-updater = "2"
# Catalogue officiel de scripts (specification 16) : les briques du greffon de
# mise a jour, aux memes versions et avec les memes options. Rien de nouveau
# n'entre dans le binaire, et la verification de signature est la meme.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
minisign-verify = "0.2"
base64 = "0.22"
# Emplacements du systeme et magasin d'approbations, lus et ecrits dans HKLM
# (specification 12.4). Deja dans l'arbre, par le greffon de mise a jour.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
# La relance en administrateur (ShellExecuteW, verbe « runas ») et la console de
# la ligne de commande (AttachConsole). Deja dans l'arbre, a cette version.
# 2.0.5, la reprise apres redemarrage : le SID du compte (jeton du processus) et
# l'heure de demarrage du PC (GetTickCount64).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Profil de developpement : c'est lui qui remplissait le disque. Sans ces deux
# reglages, `cargo test` produisait 7,3 Go d'artefacts — dont 1,4 Go de seuls
# fichiers .pdb — pour un projet dont le code source fait 7 Mo.
[profile.dev]
# De quoi lire une trace d'appels avec ses numeros de ligne, pas de quoi
# deboguer pas a pas. C'est ce dont on se sert reellement ici.
debug = "line-tables-only"

[profile.dev.package."*"]
# Les dependances ne se deboguent pas : aucun symbole pour elles. C'est la
# mesure qui pese, elles forment l'essentiel de l'arbre de compilation.
debug = false
