<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sindry</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app">

    <!-- data-tauri-drag-region rend la barre saisissable : la decoration
         native est desactivee, c'est nous qui fournissons tout le chrome. -->
    <header class="titlebar" data-tauri-drag-region>
      <!-- La marque : l'icone de Sindry (engrenage dans les flammes). -->
      <img class="brand-mark" src="marque.png" alt="" draggable="false">
      <!-- 2.2.0 : le nom et la version, qui s'empilent quand la barre se resserre. -->
      <span class="brand-txt" data-tauri-drag-region>
        <span class="brand-name" data-tauri-drag-region>Sindry</span>
        <span class="brand-ver" id="version">…</span>
      </span>

      <div class="tb-search only-expert" data-guide="recherche">
        <svg class="ico i14" aria-hidden="true"><use href="#search" /></svg>
        <input type="search" id="filtreLots" />
      </div>

      <!-- Reperes de l'assistant (specification §2) : ou on en est, jamais
           un menu — on ne saute pas une etape en cliquant dessus. -->
      <nav class="s-breadcrumb only-simple" id="sBreadcrumb" aria-hidden="true">
        <span data-crumb="1"><span id="crumb1"></span><i class="dot"></i></span>
        <span data-crumb="2"><span id="crumb2"></span><i class="dot"></i></span>
        <span data-crumb="3"><span id="crumb3"></span><i class="dot"></i></span>
        <span data-crumb="4"><span id="crumb4"></span><i class="dot"></i></span>
      </nav>

      <span class="tb-lieu" id="tbReglages"></span>

      <div class="tb-right">
        <div class="seg" id="modeSeg" role="group" data-guide="mode">
          <button type="button" data-mode-btn="simple" aria-pressed="true"></button>
          <button type="button" data-mode-btn="expert" aria-pressed="false"></button>
        </div>

        <!-- Mode test : toujours visible, des deux cotes de l'application.
             Un mode test qu'on oublie est pire que pas de mode test. -->
        <button class="pill test" id="testPill" type="button" aria-pressed="false" data-guide="simulation">
          <svg class="ico i14" aria-hidden="true"><use href="#shield" /></svg>
          <span id="testPillText"></span>
          <span class="pill-court" id="testPillCourt"></span>
        </button>

        <button class="pill ok" id="adminPill" type="button" data-guide="droits">
          <!-- La balise (1.7) : visible seulement en « Droits limites ». -->
          <span class="balise" aria-hidden="true"></span>
          <svg class="ico i14" aria-hidden="true"><use href="#shield" /></svg>
          <span id="adminPillText"></span>
          <span class="pill-court" id="adminPillCourt"></span>
        </button>

        <!-- Le centre d'aide (1.7) : visites, guides, bienvenue. Son contenu
             vient de src/guide.json. -->
        <button class="iconbtn" id="btnAide" type="button" aria-haspopup="menu" aria-expanded="false" data-guide="aide">
          <svg class="ico i17" aria-hidden="true"><use href="#help" /></svg>
        </button>

        <!-- Le journal s'ouvre toujours, meme vide, en Simple comme en Expert. -->
        <button class="iconbtn" id="btnJournal" type="button" aria-pressed="false" data-guide="journal">
          <svg class="ico i17" aria-hidden="true"><use href="#sec-execution" /></svg>
        </button>
        <button class="iconbtn" id="themeBtn" type="button">
          <svg class="ico i17" aria-hidden="true"><use href="#sun" /></svg>
        </button>

        <button class="iconbtn" id="btnSettings" type="button" aria-pressed="false">
          <svg class="ico i17" aria-hidden="true"><use href="#settings" /></svg>
        </button>

        <!-- 2.2.0 (maquette M38 C) : ce qui ne tient plus dans la barre passe
             ici — le theme, puis le journal, puis l'aide, puis les reglages. -->
        <button class="iconbtn" id="btnPlus" type="button" aria-haspopup="menu" aria-expanded="false" hidden>
          <svg class="ico i17" aria-hidden="true"><use href="#ellipsis" /></svg>
        </button>

        <div class="winctl">
          <button type="button" id="btnMin" class="min">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 12h16" /></svg>
          </button>
          <button type="button" id="btnMax" class="max">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="4.5" y="4.5" width="15" height="15" rx="1.5" /></svg>
          </button>
          <button type="button" id="btnClose" class="close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" /></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="stage">
      <!-- Le decor de l'ambiance (§15.7) : il vient de son fichier — celui des
           ambiances de base compris — et s'affiche isole : sandbox sans aucune
           permission (ni script, ni origine, ni formulaire, ni navigation), CSP
           heritee et resserree dans le document. Rempli par appliquerAccent. -->
      <div class="ambiance" aria-hidden="true">
        <iframe class="amb-perso" id="ambPerso" sandbox="" tabindex="-1" aria-hidden="true" referrerpolicy="no-referrer"></iframe>
      </div>
      <!-- Nappe de fond : une periode par motif, la plus lente. -->
      <svg class="water fond" viewBox="0 0 2360 760" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="eau" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" style="stop-color: var(--eau-a)" />
            <stop offset="1" style="stop-color: var(--eau-b)" />
          </linearGradient>
          <!-- Contour d'engrenage des graphiques de l'analyse (§17) : l'anneau,
               la jauge a dents, la double couronne. -->
          <linearGradient id="an-rouage" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" style="stop-color: var(--rouage-a)" />
            <stop offset="1" style="stop-color: var(--rouage-b)" />
          </linearGradient>
        </defs>
        <path d="M0,486 C147.5,436 442.5,536 590,486 C737.5,436 1032.5,536 1180,486 C1327.5,436 1622.5,536 1770,486 C1917.5,436 2212.5,536 2360,486 L2360,760 L0,760 Z"
              fill="url(#eau)" opacity="0.16" />
      </svg>

      <!-- Nappe de surface : deux periodes par motif, plus vive. -->
      <svg class="water surface" viewBox="0 0 2360 760" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,452 C98,402 197,402 295,452 C393,502 492,502 590,452 C688,402 787,402 885,452 C983,502 1082,502 1180,452 C1278,402 1377,402 1475,452 C1573,502 1672,502 1770,452 C1868,402 1967,402 2065,452 C2163,502 2262,502 2360,452 L2360,760 L0,760 Z"
              fill="url(#eau)" opacity="0.26" />
        <path d="M0,452 C98,402 197,402 295,452 C393,502 492,502 590,452 C688,402 787,402 885,452 C983,502 1082,502 1180,452 C1278,402 1377,402 1475,452 C1573,502 1672,502 1770,452 C1868,402 1967,402 2065,452 C2163,502 2262,502 2360,452"
              fill="none" stroke="var(--acc)" stroke-width="2.5" opacity="0.55" />
      </svg>

      <!-- Rappel permanent tant que le mode test est actif. -->
      <div id="testBanner" class="test-banner" hidden></div>

      <div id="majBanner" class="maj-banner" role="status" hidden>
        <span id="majTexte"></span>
        <span class="maj-actions">
          <button class="btn primary" type="button" id="majInstaller"></button>
          <button class="btn" type="button" id="majPlusTard"></button>
        </span>
      </div>

      <!-- Nouveautes du catalogue d'entretiens (§16.5) : meme gabarit que le
           bandeau de mise a jour, et la meme regle — proposer, jamais
           installer sans un clic. -->
      <div id="catBanner" class="maj-banner" role="status" hidden>
        <span id="catTexte"></span>
        <span class="maj-actions">
          <button class="btn primary" type="button" id="catInstaller"></button>
          <button class="btn" type="button" id="catPlusTard"></button>
        </span>
      </div>

      <div id="problems" class="problems-bar" hidden></div>

      <!-- Mode Simple (specification §2/§3/§15) : assistant en quatre etapes —
           Choisir, Verifier, Analyser, Entretien —, un seul lot a la fois.
           « Analyser » est sautee quand aucune action retenue ne sait
           analyser ; un lancement depuis l'Expert commence a « Analyser ». -->
      <section class="simple" id="simple" hidden>
        <div class="s-step" data-s="1">
          <div class="s-scroll">
            <div class="s-wrap">
              <div class="s-head-center">
                <h1 id="s1Titre"></h1>
                <p class="muted" id="s1Sous"></p>
              </div>
              <div id="recoCard" data-guide="recommande"></div>
              <div class="sect" id="sectAutres"></div>
            </div>
            <!-- Champ de bouees (specification §15.2) : pleine largeur, au bas de
                 la page ; il s'allonge et la page defile plutot que de rien
                 faire chevaucher. -->
            <div class="buoys" id="buoysZone" data-guide="bouees"></div>
            <!-- Collee en bas de l'ecran : « Continuer » reste visible, avec ce
                 qui est choisi, meme quand le champ defile. -->
            <div class="s1-barre" id="s1Barre">
              <span class="s1-choisi" id="s1Choisi"></span>
              <button class="btn primary big" type="button" id="btnContinuerChoix"></button>
            </div>
          </div>
        </div>

        <div class="s-step" data-s="2" hidden>
          <div class="s-scroll">
            <div class="s-wrap">
              <div class="s-head">
                <button class="iconbtn" type="button" data-s-back="1">
                  <svg class="ico i17" aria-hidden="true"><use href="#arrow-left" /></svg>
                </button>
                <h2 id="recapTitre"></h2>
              </div>
              <p class="muted recap-aide" id="recapAide"></p>
              <!-- Avant la liste : une liste longue repousserait l'avertissement hors de vue. -->
              <div id="droitsNote" hidden></div>
              <div class="box" id="recapBox">
                <div class="box-h" id="recapBoxTitre"></div>
                <div class="box-b list" id="recapZone"></div>
              </div>
              <p class="restore-note" id="restoreNote" hidden></p>
              <p class="restore-note" id="rebootNote" hidden></p>
              <!-- 2.1.0 : le PC peut redemarrer pendant l'entretien, et la reprise sans mot de passe (M37). -->
              <div class="reprise-note" id="repriseNote" hidden></div>
              <div class="s-nav center">
                <button class="btn primary big lancer" type="button" id="btnSuivantVerifier"></button>
              </div>
            </div>
          </div>
        </div>

        <!-- Analyse (specification §17) : « Voici ce que j'ai trouve » — on
             coche, puis on lance. -->
        <div class="s-step" data-s="3" hidden>
          <div class="s-scroll">
            <div class="s-wrap">
              <div class="s-head">
                <button class="iconbtn" type="button" data-s-back="2">
                  <svg class="ico i17" aria-hidden="true"><use href="#arrow-left" /></svg>
                </button>
                <h2 id="anLotTitre"></h2>
              </div>
              <div id="analyseZone">
                <div class="s-head-center an-entete">
                  <h1 id="anTitre"></h1>
                  <p class="muted" id="anSous"></p>
                </div>
                <div class="an-progression" id="anProgression" hidden>
                  <div class="an-prog-barre"><i id="anBarre"></i></div>
                  <div class="an-prog-t"><span id="anEtape"></span><span id="anRang"></span><span id="anPct"></span></div>
                </div>
                <div id="anResume"></div>
                <div id="anAutres"></div>
              </div>
              <p class="restore-note" id="anRestoreNote" hidden></p>
              <p class="restore-note" id="anRebootNote" hidden></p>
              <div class="reprise-note" id="anRepriseNote" hidden></div>
              <div class="s-nav center">
                <span class="an-total-bas" id="anTotal"></span>
                <button class="btn primary big lancer" type="button" id="btnLancerEntretien"></button>
              </div>
            </div>
          </div>
        </div>

        <div class="s-step" data-s="4" hidden>
          <div class="s-scroll">
            <div class="s-wrap">
              <div class="s-head-center">
                <h1 id="s3Titre"></h1>
                <p class="muted" id="s3Sous"></p>
              </div>
              <!-- Run progress (2.0.2): the ambiance's own graphic, as a band or a
                   badge, in an isolated frame; without one, Sindry's bar and its
                   percentage. -->
              <!-- 2.1.0 : l'entretien attend un redemarrage (« Plus tard »). -->
              <div class="reprise-pause" id="reprisePause" hidden></div>
              <div class="tasks-card">
                <div class="prog-frame band" id="progBand" hidden></div>
                <div class="tasks-head">
                  <div class="prog-frame badge" id="progBadge" hidden></div>
                  <div class="tasks-head-txt">
                    <div class="tasks-bilan" id="tasksBilan" hidden></div>
                    <div class="muted" id="tasksBilanDetail"></div>
                  </div>
                  <div class="tasks-pct" id="ringPct" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
                </div>
                <div class="prog-bar" id="progBar" aria-hidden="true"><i id="progBarFill"></i></div>
                <div class="tasks" id="tasksList"></div>
              </div>
              <!-- Temoin des changements sensibles (§12.5) : ce que les actions
                   ont change dans Windows, en langage courant. -->
              <div class="temoin" id="temoinBilan" hidden></div>
              <!-- 2.1.0 : le redemarrage demande a la fin ([REBOOT]), propose et jamais impose (§6.5). -->
              <div class="reprise-offre" id="offreRedemarrage" hidden></div>
              <div class="s-nav center">
                <button class="detail-toggle" type="button" id="btnDetailTechnique"></button>
              </div>
              <div class="s-nav center">
                <button class="btn stop-pill" type="button" id="btnArreterEntretien"></button>
                <button class="btn primary" type="button" id="btnRetourAccueil" hidden></button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Mode Expert (specification §2) : colonne gauche a deux onglets,
           Scripts (ranges par categorie) et Lots, detail a droite, journal
           ancre en bas. -->
      <section class="expert">
        <aside class="lots">
          <div class="lots-rows" id="lotsRows"></div>

          <!-- Journal compact, ancre au pied de la colonne. Toujours visible,
               meme sans execution : c'est lui qui dit si quelque chose tourne.
               Les lignes sont tronquees faute de largeur ; « Étendu » et
               « Complet » ouvrent le panneau du bas pour les lire en entier. -->
          <button class="lots-journal" type="button" id="lotsJournal" data-guide="journal-apercu">
            <span class="lj-head">
              <span class="lj-kicker" id="ljKicker"></span>
              <span class="lj-etat" id="ljEtat"></span>
            </span>
            <span class="lj-body" id="ljBody"></span>
          </button>
        </aside>

        <div class="detail" data-guide="fiche">
          <div class="dscroll" id="detailScroll"></div>
        </div>
      </section>

      <!-- Journal — partage entre les deux modes (le detail technique de
           l'entretien Simple, §2, est la meme sortie que le journal Expert).
           Pleine largeur, ancre en bas : « l'eau profonde » (specification
           §15.1). La v3 n'affichait jamais rien d'authentique ici : c'est
           le defaut que ce panneau corrige. -->
      <section class="term" id="term" hidden aria-live="polite">
        <svg class="term-crest" viewBox="0 0 2360 34" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0,34 L0,18 C196,-8 393,44 590,18 C787,-8 983,44 1180,18 C1376,-8 1573,44 1770,18 C1967,-8 2163,44 2360,18 L2360,34 Z" fill="var(--term-bg)" />
        </svg>
        <div class="term-head">
          <div class="term-titlewrap">
            <span class="term-kicker">Journal</span>
            <span class="term-title" id="termTitle">…</span>
            <span class="term-sub" id="termSub">…</span>
          </div>
          <div class="term-actions">
            <div class="seg" id="consoleSeg">
              <button type="button" data-console-mode="compact" aria-pressed="true"></button>
              <button type="button" data-console-mode="etendu" aria-pressed="false"></button>
              <button type="button" data-console-mode="complet" aria-pressed="false"></button>
            </div>
            <button class="term-link" type="button" id="btnLog" hidden></button>
            <button class="term-link" type="button" id="btnEffacer"></button>
            <button class="btn danger" type="button" id="btnStop"></button>
            <button class="btn" type="button" id="btnCloseTerm" hidden></button>
          </div>
        </div>
        <div class="term-prog"><i id="termProg"></i></div>
        <!-- Familles de lignes a montrer ou masquer : on masque, on ne supprime
             rien. Le choix vaut aussi pour l'apercu de la colonne Expert. -->
        <div class="term-filtres" id="termFiltres" role="group"></div>
        <div class="term-body" id="termBody"></div>
      </section>

      <!-- Reglages (specification §8) : une page de Sindry, comme Simple et
           Expert, et non plus une fenetre posee par-dessus — la barre de titre
           reste active, Simple / Expert se change sans les quitter. Une section
           a la fois, choisie dans le menu ; celles du mode Expert disparaissent
           en mode Simple. Numerotation discrete de chaque option (ex. 2.3) :
           pour designer un reglage precisement. -->
      <section class="reglages-page" id="settingsPage" hidden>
        <aside class="rg-nav">
          <button class="rg-retour" type="button" id="btnFermerReglages">
            <svg class="ico i16" aria-hidden="true"><use href="#arrow-left" /></svg>
            <span data-i18n="reglages.retour"></span>
          </button>
          <h2 class="rg-titre" id="setTitre"></h2>
          <label class="rg-cherche">
            <svg class="ico i14" aria-hidden="true"><use href="#search" /></svg>
            <input type="search" id="rgRecherche" spellcheck="false" autocomplete="off" />
          </label>
          <nav class="rg-menu" id="setNav">
            <button class="rg-item" type="button" data-rg-section="general">
              <span class="rg-i"><svg class="ico i17" aria-hidden="true"><use href="#sec-general" /></svg></span>
              <span class="num">1</span><span id="navGeneral"></span>
            </button>
            <button class="rg-item" type="button" data-rg-section="apparence">
              <span class="rg-i"><svg class="ico i17" aria-hidden="true"><use href="#sec-apparence" /></svg></span>
              <span class="num">2</span><span id="navApparence"></span>
            </button>
            <button class="rg-item" type="button" data-rg-section="catalogue">
              <span class="rg-i"><svg class="ico i17" aria-hidden="true"><use href="#sec-catalogue" /></svg></span>
              <span class="num">3</span><span id="navCatalogue"></span>
            </button>
            <button class="rg-item only-expert" type="button" data-rg-section="actions">
              <span class="rg-i"><svg class="ico i17" aria-hidden="true"><use href="#sec-execution" /></svg></span>
              <span class="num">4</span><span id="navActions"></span>
            </button>
            <button class="rg-item" type="button" data-rg-section="avance">
              <span class="rg-i"><svg class="ico i17" aria-hidden="true"><use href="#sec-avance" /></svg></span>
              <span class="num">5</span><span id="navAvance"></span>
            </button>
          </nav>
        </aside>

        <div class="rg-page" id="setScroll">
          <div class="rg-in">
            <section class="set-group" id="sec-general" data-rg-page="general" data-rg-icone="sec-general">
              <header class="rg-h">
                <span class="rg-gi"><svg class="ico i24" aria-hidden="true"><use href="#sec-general" /></svg></span>
                <div><h1><span class="num">1</span><span id="secGeneralTitre"></span></h1><p data-i18n="reglages.sous_general"></p></div>
              </header>
              <div class="rg-cartes">
                <div class="setrow" data-num="1.1">
                  <span class="setrow-txt"><span class="num">1.1</span><span class="rg-libelle"><b id="setLangueLabel"></b><span class="desc" data-i18n="reglages.d_langue"></span></span></span>
                  <div class="seg" id="setLangueSeg">
                    <button type="button" data-set-lang="fr">Français</button>
                    <button type="button" data-set-lang="en">English</button>
                  </div>
                </div>
                <div class="setrow" data-num="1.2">
                  <span class="setrow-txt"><span class="num">1.2</span><span class="rg-libelle"><b id="setMajLabel"></b><span class="desc" data-i18n="reglages.d_maj"></span></span></span>
                  <select class="cat-select" id="setMajSelect">
                    <option value="propose"></option>
                    <option value="beta"></option>
                    <option value="never"></option>
                  </select>
                </div>
                <div class="setrow" data-num="1.3">
                  <span class="setrow-txt"><span class="num">1.3</span><span class="rg-libelle"><b id="setMajVerifLabel"></b><span class="desc" data-i18n="reglages.d_maj_verifier"></span><span class="maj-etat" id="majEtat" aria-live="polite"></span></span></span>
                  <button class="btn compact" type="button" id="btnVerifierMaj"></button>
                </div>
                <div class="setrow" data-num="1.4">
                  <span class="setrow-txt"><span class="num">1.4</span><span class="rg-libelle"><b id="setVisiteLabel"></b><span class="desc" data-i18n="reglages.d_visite"></span></span></span>
                  <button class="btn compact" type="button" id="btnRevoirVisite"></button>
                </div>
                <div class="setrow" data-num="1.5">
                  <span class="setrow-txt"><span class="num">1.5</span><span class="rg-libelle"><b id="setNumerosLabel"></b><span class="desc" data-i18n="reglages.d_numeros"></span></span></span>
                  <button class="switch" type="button" role="switch" id="setNumerosToggle" aria-checked="false"></button>
                </div>
                <!-- 2.2.0 : numeroter les reglages d'une action, et toujours demarrer en administrateur. -->
                <div class="setrow" data-num="1.6">
                  <span class="setrow-txt"><span class="num">1.6</span><span class="rg-libelle"><b data-i18n="reglages.numeros_options"></b><span class="desc" data-i18n="reglages.d_numeros_options"></span></span></span>
                  <select class="cat-select" id="setNumerosOptions">
                    <option value="jamais" data-i18n="reglages.numeros_jamais"></option>
                    <option value="auto" data-i18n="reglages.numeros_auto"></option>
                    <option value="toujours" data-i18n="reglages.numeros_toujours"></option>
                  </select>
                </div>
                <div class="setrow" data-num="1.7">
                  <span class="setrow-txt"><span class="num">1.7</span><span class="rg-libelle"><b data-i18n="reglages.admin_demarrage"></b><span class="desc" data-i18n="reglages.d_admin_demarrage"></span></span></span>
                  <button class="switch" type="button" role="switch" id="setAdminDemarrage" aria-checked="false"></button>
                </div>
              </div>
            </section>

            <!-- Apparence (2.0.1) : clair ou sombre, taille, ambiance, et le
                 partage des ambiances (§15.7). -->
            <section class="set-group" id="sec-apparence" data-rg-page="apparence" data-rg-icone="sec-apparence" hidden>
              <header class="rg-h">
                <span class="rg-gi"><svg class="ico i24" aria-hidden="true"><use href="#sec-apparence" /></svg></span>
                <div><h1><span class="num">2</span><span id="secApparenceTitre"></span></h1><p data-i18n="reglages.sous_apparence"></p></div>
              </header>
              <div class="rg-cartes">
                <div class="setrow" data-num="2.1">
                  <span class="setrow-txt"><span class="num">2.1</span><span class="rg-libelle"><b id="setThemeLabel"></b><span class="desc" data-i18n="reglages.d_theme"></span><span class="desc" id="setThemeNote" hidden></span></span></span>
                  <div class="seg" id="setThemeSeg">
                    <button type="button" data-set-theme="light"></button>
                    <button type="button" data-set-theme="dark"></button>
                    <button type="button" data-set-theme="system"></button>
                  </div>
                </div>
                <div class="setrow" data-num="2.2">
                  <span class="setrow-txt"><span class="num">2.2</span><span class="rg-libelle"><b id="setEchelleLabel"></b><span class="desc" data-i18n="reglages.d_echelle"></span></span></span>
                  <select class="cat-select" id="setEchelleSelect">
                    <option value="1">100 %</option>
                    <option value="1.15">115 %</option>
                    <option value="1.3">130 %</option>
                    <option value="1.5">150 %</option>
                    <option value="1.75">175 %</option>
                  </select>
                </div>
                <div class="setrow" data-num="2.3">
                  <span class="setrow-txt"><span class="num">2.3</span><span class="rg-libelle"><b id="setAccentLabel"></b><span class="desc" data-i18n="reglages.d_accent"></span></span></span>
                  <div class="accents" id="setAccentChoix" role="radiogroup">
                    <!-- Une pastille par ambiance installee : rendreAmbiances. -->
                  </div>
                </div>
                <div class="setrow amb-partage" data-num="2.4">
                  <span class="setrow-txt"><span class="num">2.4</span><span class="rg-libelle"><b data-i18n="ambiance.titre"></b><span class="desc" data-i18n="ambiance.d_partage"></span><span class="maj-etat" id="ambianceResultat" aria-live="polite" hidden></span><span class="amb-ignorees" id="ambiancesIgnorees" hidden></span></span></span>
                  <div class="amb-actions">
                    <button class="btn compact" type="button" id="btnImporterAmbiance" data-i18n="ambiance.importer"></button>
                    <button class="btn compact" type="button" id="btnExporterAmbiance" data-i18n="ambiance.exporter"></button>
                    <button class="btn compact danger" type="button" id="btnRetirerAmbiance" data-i18n="ambiance.retirer" hidden></button>
                    <button class="btn compact" type="button" id="btnDossierAmbiances" data-i18n="ambiance.dossier"></button>
                    <button class="btn compact" type="button" id="btnBaseAmbiances" data-i18n="ambiance.base"></button>
                    <button class="btn compact" type="button" id="btnGuideAmbiance" data-i18n="ambiance.guide"></button>
                    <input type="file" id="fichierImportAmbiance" accept=".sindry-ambiance,application/json" hidden />
                  </div>
                </div>
              </div>
            </section>

            <!-- Catalogues d'actions (specification §16) : visibles dans les deux
                 modes, l'officiel en tete. Ajouter, modifier ou retirer un
                 catalogue reste au mode Expert, et demande les droits
                 administrateur (leur liste vit dans HKLM). Rien ne s'installe
                 sans un clic. -->
            <section class="set-group" id="sec-catalogue" data-rg-page="catalogue" data-rg-icone="sec-catalogue" hidden>
              <header class="rg-h">
                <span class="rg-gi"><svg class="ico i24" aria-hidden="true"><use href="#sec-catalogue" /></svg></span>
                <div><h1><span class="num">3</span><span id="secCatalogueTitre"></span></h1><p data-i18n="reglages.sous_catalogue"></p></div>
              </header>
              <div class="rg-cartes">
                <!-- 3.1, the catalogues (M29, 2.0.2): the commands in a bar above,
                     data only in the table, what the table cannot show in the pane
                     below — and there, each catalogue's action list, where its
                     actions are ticked. Rendered by rendreSources(). -->
                <div class="cat-box" id="catBox" data-num="3.1"></div>
                <p class="rg-bandeau" id="sourcesDroits" hidden>
                  <svg class="ico i20" aria-hidden="true"><use href="#lock" /></svg>
                  <span data-i18n="cat.droits"></span>
                  <button class="btn compact primary" type="button" id="btnSourcesDroits" data-i18n="reglages.proteges_relancer"></button>
                </p>
                <div class="setrow" data-num="3.2">
                  <span class="setrow-txt"><span class="num">3.2</span><span class="rg-libelle"><b id="setCatalogueVerifLabel"></b><span class="desc" data-i18n="reglages.d_catalogue_verif"></span></span></span>
                  <select class="cat-select" id="setCatalogueSelect">
                    <option value="startup"></option>
                    <option value="manual"></option>
                  </select>
                </div>
                <!-- 3.3, application icons (2.0.4): downloaded from the
                     Sindry-Media-Library repository only, on by default. -->
                <div class="setrow" data-num="3.3">
                  <span class="setrow-txt"><span class="num">3.3</span><span class="rg-libelle"><b data-i18n="reglages.icones_app"></b><span class="desc" data-i18n="reglages.d_icones_app"></span></span></span>
                  <button class="switch" type="button" role="switch" id="setIconesToggle" aria-checked="true"></button>
                </div>
              </div>
              <!-- Add or edit a catalogue, in a pane on the right: a GitHub
                   repository and its publisher's public key. Nothing is recorded
                   before its index verifies with that key. -->
              <div class="cat-drawer-bg" id="sourceDrawerBg" hidden></div>
              <aside class="cat-drawer" id="sourceDrawer" role="dialog" aria-modal="true" aria-labelledby="sourceFormTitre" hidden>
                <form class="source-form" id="sourceForm" novalidate>
                  <header class="cat-drawer-head">
                    <b id="sourceFormTitre"></b>
                    <button class="cat-close" type="button" id="btnSourceFermer"><svg class="ico i17" aria-hidden="true"><use href="#x" /></svg></button>
                  </header>
                  <div class="cat-drawer-body">
                    <p class="desc" data-i18n="cat.form_aide"></p>
                    <label><span data-i18n="cat.form_depot"></span><input type="text" id="sourceDepot" spellcheck="false" autocomplete="off" /></label>
                    <label><span data-i18n="cat.form_cle"></span><textarea class="mono" id="sourceCle" rows="3" spellcheck="false"></textarea></label>
                    <label><span data-i18n="cat.form_nom"></span><input type="text" id="sourceNom" maxlength="60" autocomplete="off" /></label>
                    <p class="ajout-err" id="sourceErreur" role="alert" hidden></p>
                  </div>
                  <footer class="source-form-pied">
                    <button class="btn" type="button" id="btnSourceAnnuler" data-i18n="cat.form_annuler"></button>
                    <button class="btn primary" type="submit" id="btnSourceValider"></button>
                  </footer>
                </form>
              </aside>
              <div class="cat-menu" id="catMenu" role="menu" hidden></div>
            </section>

            <section class="set-group only-expert" id="sec-actions" data-rg-page="actions" data-rg-icone="sec-execution" hidden>
              <header class="rg-h">
                <span class="rg-gi"><svg class="ico i24" aria-hidden="true"><use href="#sec-execution" /></svg></span>
                <div><h1><span class="num">4</span><span id="secActionsTitre"></span></h1><p data-i18n="reglages.sous_actions"></p></div>
              </header>
              <div class="rg-cartes">
                <div class="setrow" data-num="4.1">
                  <span class="setrow-txt"><span class="num">4.1</span><span class="rg-libelle"><b id="setEchecLabel"></b><span class="desc" data-i18n="reglages.d_echec"></span></span></span>
                  <select class="cat-select" id="setEchecSelect">
                    <option value="continue"></option>
                    <option value="stop"></option>
                  </select>
                </div>
                <div class="setrow" data-num="4.2">
                  <span class="setrow-txt"><span class="num">4.2</span><span class="rg-libelle"><b><span id="setPolitiqueLabel"></span>
                    <button class="aide" type="button" id="aidePolitique" aria-label="?">
                      <svg class="ico i14" aria-hidden="true"><use href="#help" /></svg>
                    </button></b><span class="desc" data-i18n="reglages.d_politique"></span></span></span>
                  <select class="cat-select" id="setPolitiqueSelect">
                    <option value="bypass">Bypass</option>
                    <option value="remotesigned">RemoteSigned</option>
                    <option value="unrestricted">Unrestricted</option>
                  </select>
                </div>
                <div class="setrow" data-num="4.3">
                  <span class="setrow-txt"><span class="num">4.3</span><span class="rg-libelle"><b data-i18n="reglages.dossier_scripts"></b><span class="desc" data-i18n="reglages.d_dossier"></span><span class="mono" id="cheminsScripts"></span></span></span>
                  <button class="btn compact" type="button" id="btnOuvrirDossierReglages"></button>
                </div>
                <div class="setrow" data-num="4.4">
                  <span class="setrow-txt"><span class="num">4.4</span><span class="rg-libelle"><b data-i18n="reglages.reanalyser"></b><span class="desc" data-i18n="reglages.d_reanalyser"></span></span></span>
                  <button class="btn compact" type="button" id="btnReanalyserReglages"></button>
                </div>
                <!-- 2.1.0 : le plafond de redemarrages (HKLM, administrateur seulement), et ARSO. -->
                <div class="setrow" data-num="4.5">
                  <span class="setrow-txt"><span class="num">4.5</span><span class="rg-libelle"><b data-i18n="reglages.max_redemarrages"></b><span class="desc" data-i18n="reglages.d_max_redemarrages"></span><span class="desc" id="maxRedemarragesNote" hidden></span></span></span>
                  <span class="stepper" id="maxRedemarrages">
                    <button type="button" data-max-redemarrages="-1" aria-label="-1">−</button><span id="maxRedemarragesValeur">3</span><button type="button" data-max-redemarrages="1" aria-label="+1">+</button>
                  </span>
                </div>
                <div class="setrow" data-num="4.6">
                  <span class="setrow-txt"><span class="num">4.6</span><span class="rg-libelle"><b data-i18n="reglages.arso"></b><span class="desc" data-i18n="reglages.d_arso"></span></span></span>
                  <span class="setrow-fin" id="arsoEtat"></span>
                </div>
              </div>
            </section>

            <section class="set-group only-expert" id="sec-proteges" data-rg-page="proteges" data-rg-icone="shield-check" hidden>
              <div class="rg-fil">
                <button type="button" data-rg-section="avance" id="filAvance"></button>
                <svg class="ico i14" aria-hidden="true"><use href="#chevron-right" /></svg>
                <span data-i18n="reglages.proteges"></span>
              </div>
              <header class="rg-h">
                <span class="rg-gi"><svg class="ico i24" aria-hidden="true"><use href="#shield-check" /></svg></span>
                <div><h1><span class="num">5.2</span><span data-i18n="reglages.proteges"></span></h1><p data-i18n="garde.page_sous"></p></div>
              </header>
              <p class="rg-bandeau" id="protegesDroits" hidden>
                <svg class="ico i20" aria-hidden="true"><use href="#lock" /></svg>
                <span id="protegesDroitsTexte"></span>
                <button class="btn compact primary" type="button" id="btnProtegesDroits"></button>
              </p>
              <ul class="d-arbre" id="protegesPlan"></ul>
              <form class="ajout" id="protegesAjout">
                <svg class="ico" aria-hidden="true"><use href="#folder-plus" /></svg>
                <input class="mono" type="text" id="protegesAjoutChemin" spellcheck="false" autocomplete="off" />
                <button class="btn compact" type="submit" id="btnProtegesAjouter"></button>
              </form>
              <p class="ajout-err" id="protegesErreur" role="alert" hidden></p>
            </section>

            <!-- Avance (2.0.1) : visible dans les deux modes pour l'historique ; le
                 reste n'apparait qu'en Expert. -->
            <section class="set-group" id="sec-avance" data-rg-page="avance" data-rg-icone="sec-avance" hidden>
              <header class="rg-h">
                <span class="rg-gi"><svg class="ico i24" aria-hidden="true"><use href="#sec-avance" /></svg></span>
                <div><h1><span class="num">5</span><span id="secAvanceTitre"></span></h1><p data-i18n="reglages.sous_avance"></p></div>
              </header>
              <div class="rg-cartes">
                <div class="setrow only-expert" data-num="5.1">
                  <span class="setrow-txt"><span class="num">5.1</span><span class="rg-libelle"><b id="setJournauxLabel"></b><span class="desc" data-i18n="reglages.d_journaux"></span></span></span>
                  <input class="cat-select" type="number" id="setJournauxInput" min="0" step="10" style="width:90px" />
                </div>
                <div class="setrow only-expert rg-protege" id="protegesResume" data-num="5.2">
                  <span class="rg-bouclier"><svg class="ico i20" aria-hidden="true"><use id="protegesResumeIcone" href="#shield-check" /></svg></span>
                  <span class="setrow-txt"><span class="num">5.2</span><span class="rg-libelle"><b id="setProtegesLabel"></b><span class="desc" id="protegesResumeTexte"></span></span></span>
                  <button class="btn compact" type="button" id="btnProtegesGerer">
                    <span data-i18n="garde.gerer"></span>
                    <svg class="ico i14" aria-hidden="true"><use href="#chevron-right" /></svg>
                  </button>
                </div>
                <div class="setrow only-expert" data-num="5.3">
                  <span class="setrow-txt"><span class="num">5.3</span><span class="rg-libelle"><b data-i18n="reglages.rapport_conformite"></b><span class="desc" data-i18n="reglages.d_conformite"></span></span></span>
                  <button class="btn compact" type="button" id="btnRapportConformite"></button>
                </div>
                <div class="box only-expert" id="conformiteZone" hidden></div>
                <div class="setrow only-expert" data-num="5.4">
                  <span class="setrow-txt"><span class="num">5.4</span><span class="rg-libelle"><b data-i18n="reglages.export"></b><span class="desc" data-i18n="reglages.d_export"></span><span class="maj-etat" id="exportResultat" hidden></span></span></span>
                  <button class="btn compact" type="button" id="btnExporterConfig"></button>
                </div>
                <div class="setrow only-expert" data-num="5.5">
                  <span class="setrow-txt"><span class="num">5.5</span><span class="rg-libelle"><b data-i18n="reglages.import"></b><span class="desc" data-i18n="reglages.d_import"></span><span class="maj-etat" id="importResultat" hidden></span></span></span>
                  <button class="btn compact" type="button" id="btnImporterConfig"></button>
                  <input type="file" id="fichierImportConfig" accept="application/json" hidden />
                </div>
                <div class="setrow only-expert" data-num="5.6">
                  <span class="setrow-txt"><span class="num">5.6</span><span class="rg-libelle"><b data-i18n="reglages.reinitialiser"></b><span class="desc" data-i18n="reglages.d_reinitialiser"></span></span></span>
                  <button class="btn compact danger" type="button" id="btnReinitialiserConfig"></button>
                </div>
                <!-- L'historique s'affiche directement, sous son titre. -->
                <div class="setrow rg-histo-titre" data-num="5.7">
                  <span class="setrow-txt"><span class="num">5.7</span><span class="rg-libelle"><b data-i18n="reglages.nav_histo"></b><span class="desc" data-i18n="reglages.sous_histo"></span></span></span>
                </div>
                <div class="box" id="historiqueZone"></div>
              </div>
            </section>

            <!-- Resultats de la recherche : remplis par rechercherReglages(). -->
            <section class="set-group" id="rgResultats" hidden></section>
          </div>
        </div>
      </section>
    </main>

  </div>

  <!-- Premier demarrage (specification §13) : une visite en quatre pages,
       relancable depuis les Reglages. Chaque page : une illustration animee,
       l'essentiel en trois phrases, et le detail pour qui veut en savoir plus.
       Le contenu est rendu par rendreVisite (main.js). -->
  <div class="backdrop" id="onboarding" hidden>
    <div class="onb-card onb-visite" role="dialog" aria-modal="true" aria-labelledby="onbTitre">
      <div class="onb-pas" id="onbPas"></div>
      <div class="onb-page" id="onbPage"></div>
      <div class="onb-nav">
        <button class="btn" type="button" id="btnOnbRetour"></button>
        <button class="btn onb-passer" type="button" id="btnOnbPasser"></button>
        <button class="btn primary big" type="button" id="btnOnbSuivant"></button>
      </div>
    </div>
  </div>

  <!-- Confiance a la premiere execution (specification §12.1) : seule
       exception au principe "constater, jamais bloquer" — une confirmation
       nommee, jamais une case a cocher reflexe. -->
  <div class="backdrop" id="trustOverlay" hidden>
    <div class="trust-card">
      <div class="trust-head">
        <h2 id="trustTitre"></h2>
        <p class="muted" id="trustSous"></p>
      </div>
      <div class="box" id="trustAttention" hidden></div>
      <div class="trust-code"><pre id="trustCode"></pre></div>
      <div class="s-nav">
        <button class="btn" type="button" id="btnTrustAnnuler"></button>
        <button class="btn primary" type="button" id="btnTrustApprouver"></button>
      </div>
    </div>
  </div>

  <!-- Choix d'icone : une vraie fenetre, avec recherche. La grille en ligne
       ne pouvait en montrer qu'une trentaine sans pousser le reste de la page
       hors de l'ecran. -->
  <div class="backdrop" id="iconesOverlay" hidden>
    <div class="ic-card">
      <div class="set-head">
        <h2 id="iconesTitre"></h2>
        <button class="iconbtn" type="button" id="btnFermerIcones">
          <svg class="ico i17" aria-hidden="true"><use href="#x" /></svg>
        </button>
      </div>
      <div class="ic-recherche">
        <svg class="ico i14" aria-hidden="true"><use href="#search" /></svg>
        <input type="search" id="rechercheIcone" />
      </div>
      <div class="ic-grille" id="iconesGrille"></div>
      <p class="muted" id="iconesCompte"></p>
    </div>
  </div>

  <!-- Des scripts, mais aucun catalogue (specification §16.6) : un rappel, une
       fois par session, avec un « ne plus afficher » respecte definitivement. -->
  <div class="backdrop" id="rappelCatalogue" hidden>
    <div class="onb-card">
      <img class="onb-logo" src="marque.png" alt="" draggable="false">
      <h1 id="rappelTitre"></h1>
      <p class="onb-text" id="rappelTexte"></p>
      <label class="rappel-case"><input type="checkbox" id="rappelNePlus" /> <span id="rappelNePlusLabel"></span></label>
      <div class="s-nav center">
        <button class="btn" type="button" id="btnRappelFermer"></button>
        <button class="btn primary" type="button" id="btnRappelInstaller"></button>
      </div>
    </div>
  </div>

  <!-- Droits administrateur : ce que c'est, pourquoi, et comment les obtenir.
       L'application s'ouvre desormais sans eux (manifeste asInvoker) : il faut
       donc pouvoir expliquer la situation, pas seulement l'afficher. -->
  <div class="backdrop" id="droitsOverlay" hidden>
    <div class="onb-card">
      <div class="onb-mark"><svg class="ico i28" aria-hidden="true"><use href="#shield" /></svg></div>
      <h1 id="droitsTitre"></h1>
      <p class="onb-text" id="droitsTexte"></p>
      <div class="s-nav center" style="flex-wrap:wrap">
        <button class="btn" type="button" id="btnFermerDroits"></button>
        <button class="btn primary" type="button" id="btnRelancerAdmin" hidden></button>
      </div>
    </div>
  </div>

  <!-- 2.1.0 (§6.10, M37) : le redemarrage au milieu d'un entretien, l'entretien
       retrouve au lancement, et le mode restreint apres le redemarrage. -->
  <!-- 2.2.0 : la mise a jour se deroule dans Sindry, pas dans l'installeur. -->
  <div class="backdrop" id="majOverlay" hidden></div>
  <div class="backdrop" id="redemarrageOverlay" hidden></div>
  <div class="backdrop" id="repriseDialogue" hidden></div>
  <div class="restreint" id="restreintOverlay" role="dialog" aria-modal="true" hidden></div>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <script type="module" src="main.js"></script>
</body>
</html>
