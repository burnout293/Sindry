<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redémarrage et reprise</title>
<!--
  Mockup M37 (2.1.0): a maintenance run that restarts the PC in its middle and
  resumes on its own afterwards.
  - « Vérifier »: the run announces the restart, and whether Windows will sign
    the user back in by itself (Automatic Restart Sign-On, ARSO);
  - the restart window: a 60 s countdown, « Redémarrer maintenant », « Plus tard »;
  - the restricted mode after the restart: a small window that cannot be
    closed, « Action en cours », until the run ends;
  - the summary, before and after the restart, with the final restart offer
    (spec 6.5);
  - a run found interrupted at a manual launch;
  - the Expert setting: restarts at most per run (HKLM, administrator only).
  Code in English, visible text in French. Fictitious data.
-->
<style>
@font-face { font-family: 'Inter'; font-weight: 100 900; src: url('../../src/fonts/inter-latin-wght-normal.woff2') format('woff2-variations'); }
@font-face { font-family: 'Sindry Mono'; font-weight: 400; src: url('../../src/fonts/sindry-mono-400.woff2') format('woff2'); }
:root {
  --bg: #0B0F16; --surface: #0F1520; --surface-2: #141C2A; --surface-3: #1B2536; --surface-soft: #0D121B;
  --border: #2A3445; --border-2: #42506A; --grid: #161E2B;
  --text: #E9EEF5; --text-2: #8C9AAE; --text-3: #8190A5; --ink: #1A0B06;
  --acc: #FD7D26; --acc-2: #F0782A; --acc-on: #FF9A55; --acc-soft: #2A1A10;
  --ok: #3FD69B; --warn: #FFC24D; --err: #FF6B7A; --info: #7FB2FF;
  --ok-s: #0C2620; --warn-s: #2A2210; --err-s: #2E141C; --info-s: #12203A;
  --desk-1: #0E2A4A; --desk-2: #071426;
  --ui: 'Inter', 'Segoe UI', system-ui, sans-serif; --mono: 'Sindry Mono', Consolas, monospace;
  --shadow: 0 16px 40px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F6F4EF; --surface: #FFFFFF; --surface-2: #EFECE5; --surface-3: #E4E0D6; --surface-soft: #FAF9F6;
  --border: #DCD7CC; --border-2: #B6AE9F; --grid: #ECE8E0;
  --text: #141A24; --text-2: #5C6778; --text-3: #5F6A7B; --ink: #1A0B06;
  --acc: #E2640F; --acc-2: #F0782A; --acc-on: #A84A08; --acc-soft: #FCEBDD;
  --ok: #0E7550; --warn: #8F5D0C; --err: #C0263F; --info: #1F5FBF;
  --ok-s: #E6F5EC; --warn-s: #FBF3E2; --err-s: #FBEAEC; --info-s: #E8F0FC;
  --desk-1: #3B6EA8; --desk-2: #1C3E66;
  --shadow: 0 16px 40px rgba(20, 26, 36, .18);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 var(--ui); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.ico { width: 15px; height: 15px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
  padding: 12px 20px; background: color-mix(in srgb, var(--bg) 92%, transparent); border-bottom: 1px solid var(--border); backdrop-filter: blur(6px); }
.topbar h1 { margin: 0; font-size: 15px; font-weight: 700; }
.topbar p { margin: 0; color: var(--text-3); font-size: 12px; flex: 1 1 260px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
.seg button { border: 0; background: none; padding: 6px 11px; border-radius: 7px; font-weight: 650; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--acc); color: var(--ink); }
.variants { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; }
.variant { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }
.variant:empty { display: none; }

.stage { max-width: 1100px; margin: 18px auto 40px; padding: 0 20px; }
.screen { position: relative; border: 1px solid var(--border); border-radius: 18px; overflow: hidden; background: var(--bg); min-height: 620px;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 32px 32px; }
.appbar { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 80%, transparent); }
.appbar img { width: 22px; height: 22px; }
.appbar b { font-size: 14px; }
.appbar .ver { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.steps { display: flex; gap: 14px; margin-left: 10px; font-size: 12px; font-weight: 650; color: var(--text-3); }
.steps span::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--border-2); margin-right: 6px; vertical-align: 1px; }
.steps .on { color: var(--text); } .steps .on::before { background: var(--acc); }
.steps .done::before { background: var(--ok); }
.screen-head { padding: 20px 28px 4px; text-align: center; position: relative; }
.screen-head .back { position: absolute; left: 24px; top: 18px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.screen-head .back i { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); display: grid; place-items: center; font-style: normal; color: var(--text-2); }
.screen-head h2 { margin: 34px 0 4px; font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
.screen-head p { margin: 0; color: var(--text-2); }
.body { padding: 18px 28px 22px; max-width: 760px; margin: 0 auto; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; }
.footer { display: flex; align-items: center; gap: 14px; padding: 14px 28px; border-top: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface) 94%, transparent); flex-wrap: wrap; }
.footer .sum { flex: 1; font-weight: 650; }
.footer .sum small { display: block; font-weight: 500; color: var(--text-3); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); font-weight: 700; white-space: nowrap; color: var(--text-2); }
.btn.primary { background: linear-gradient(135deg, var(--acc), var(--acc-2)); border: 0; color: var(--ink); font-weight: 800; }
.btn.small { height: 32px; padding: 0 12px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.link { border: 0; background: none; padding: 0; color: var(--acc-on); font-weight: 700; font-size: 12px; white-space: nowrap; }
.link.muted { color: var(--text-3); font-weight: 600; }

.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); }
.rows > .row:first-child { border-top: 0; }
.row .t { flex: 1; min-width: 0; }
.row .t b { font-weight: 650; display: block; }
.row .t small { color: var(--text-3); font-size: 12px; }
.row input { width: 17px; height: 17px; accent-color: var(--acc); }
.tile { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }
.state { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; font-size: 12px; font-weight: 800; }
.state.ok { background: var(--ok-s); color: var(--ok); }
.state.run { background: var(--acc-soft); color: var(--acc-on); }
.state.wait { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); }
.state.pause { background: var(--info-s); color: var(--info); }
.row.muted .t b { color: var(--text-2); }
.bd { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.bd .ico { width: 11px; height: 11px; }
.bd.reboot { background: var(--info-s); color: var(--info); }
.bd.ok { background: var(--ok-s); color: var(--ok); }
.bd.neutral { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }

.notes-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; font-size: 12.5px; }
.note .ico { margin-top: 2px; }
.note b { display: block; }
.note.info { background: var(--surface-2); color: var(--text-2); }
.note.warn { background: var(--warn-s); color: var(--warn); }
.note.ok { background: var(--ok-s); color: var(--ok); }
.note.blue { background: var(--info-s); color: var(--info); }
.note .grow { flex: 1; }
.note .act { margin-top: 8px; }

.sep { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--border); background: var(--info-s); color: var(--info); font-size: 12px; font-weight: 700; }
.sep .line { flex: 1; height: 1px; background: color-mix(in srgb, var(--info) 35%, transparent); }

/* Overlays */
.veil { position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 55%, transparent); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 10; padding: 20px; }
.modal { width: min(460px, 100%); padding: 22px 22px 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); text-align: center; }
.modal h3 { margin: 12px 0 6px; font-size: 18px; }
.modal p { margin: 0 0 6px; color: var(--text-2); }
.modal .btns { display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.modal .foot { margin-top: 12px; font-size: 11.5px; color: var(--text-3); }
.ring { position: relative; width: 92px; height: 92px; margin: 0 auto; }
.ring svg { width: 92px; height: 92px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }
.ring .track { stroke: var(--surface-3); }
.ring .bar { stroke: var(--acc); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ring .num small { display: block; font-size: 10.5px; font-weight: 600; color: var(--text-3); margin-top: -8px; }
.arso { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 650; }
.arso.on { background: var(--ok-s); color: var(--ok); }
.arso.off { background: var(--surface-2); color: var(--text-2); }
.banner { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding: 12px 14px; border-radius: 14px; background: var(--info-s); color: var(--info); }
.banner .grow { flex: 1; }
.banner b { display: block; color: var(--text); }

/* Restricted mode: the desktop, then the small window */
.desk { position: relative; min-height: 620px; background: radial-gradient(120% 90% at 30% 20%, var(--desk-1), var(--desk-2)); display: grid; place-items: center; padding: 30px 20px 70px; }
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: rgba(10, 14, 22, .82); display: flex; align-items: center; gap: 10px; padding: 0 12px; }
.taskbar i { width: 26px; height: 26px; border-radius: 6px; background: rgba(255, 255, 255, .1); }
.taskbar i.app { background: rgba(253, 125, 38, .35); box-shadow: inset 0 -2px 0 var(--acc); }
.taskbar span { margin-left: auto; font-family: var(--mono); font-size: 11px; color: #C9D3E0; }
.win { width: min(470px, 100%); border-radius: 12px; overflow: hidden; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 24px 60px rgba(0, 0, 0, .45); }
.win-title { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; background: var(--surface-2); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-2); }
.win-title img { width: 16px; height: 16px; }
.win-title .nox { margin-left: auto; font-size: 11px; color: var(--text-3); }
.win-body { padding: 18px 20px 16px; }
.win-head { display: flex; gap: 14px; align-items: center; }
.win-head img { width: 46px; height: 46px; }
.win-head h3 { margin: 0; font-size: 17px; }
.win-head p { margin: 2px 0 0; color: var(--text-2); }
.job { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: var(--surface-soft); border: 1px solid var(--border); }
.job b { display: block; }
.job small { color: var(--text-3); font-size: 12px; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; margin: 10px 0 6px; }
.bar i { display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, var(--acc), var(--acc-2)); transition: width .6s; }
.step { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); }
.dots { display: flex; gap: 6px; margin-top: 12px; align-items: center; font-size: 12px; color: var(--text-3); }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-3); border: 1px solid var(--border-2); }
.dots i.ok { background: var(--ok); border-color: var(--ok); }
.dots i.run { background: var(--acc); border-color: var(--acc); }
.win-foot { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 12px; color: var(--text-3); }
.win-foot .grow { flex: 1; }
.confirm { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--warn-s); color: var(--warn); font-size: 12.5px; }
.confirm b { display: block; color: var(--text); }
.confirm .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.mini-count { margin-top: 14px; padding: 14px; border-radius: 12px; background: var(--acc-soft); display: flex; align-items: center; gap: 14px; }
.mini-count .ring, .mini-count .ring svg { width: 64px; height: 64px; }
.mini-count .ring .num { font-size: 19px; }
.mini-count b { display: block; }
.mini-count .btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.lockhint { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: rgba(0, 0, 0, .45); color: #E9EEF5; font-size: 11.5px; white-space: nowrap; }

/* Settings */
.settings { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 620px; }
.side { border-right: 1px solid var(--border); padding: 18px 12px; background: color-mix(in srgb, var(--surface) 70%, transparent); }
.side div { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; font-weight: 650; color: var(--text-2); }
.side div.on { background: var(--acc-soft); color: var(--acc-on); }
.side .num, .setrow .num { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.panel { padding: 24px 28px; }
.panel h2 { margin: 0; font-size: 20px; display: flex; gap: 10px; align-items: baseline; }
.panel > p { margin: 4px 0 16px; color: var(--text-2); }
.setrow { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-top: 1px solid var(--border); }
.setrow:first-child { border-top: 0; }
.setrow .lbl { flex: 1; min-width: 0; display: flex; gap: 10px; }
.setrow .lbl b { display: block; }
.setrow .lbl .desc { display: block; color: var(--text-3); font-size: 12px; }
.setrow.new { background: color-mix(in srgb, var(--acc) 7%, transparent); }
.select { padding: 7px 12px; border-radius: 10px; border: 1px solid var(--border-2); background: var(--surface-2); font-weight: 650; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border-2); border-radius: 999px; overflow: hidden; }
.stepper button { width: 34px; height: 32px; border: 0; background: var(--surface-2); font-size: 16px; font-weight: 700; }
.stepper span { min-width: 40px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.stepper.off { opacity: .5; }
.admin-note { display: flex; align-items: center; gap: 10px; margin: 8px 16px 14px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); color: var(--text-2); font-size: 12px; }
.admin-note .grow { flex: 1; }
.newtag { font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 999px; background: var(--acc); color: var(--ink); margin-left: 6px; vertical-align: 2px; }

.notes { max-width: 1100px; margin: 0 auto 60px; padding: 0 20px; color: var(--text-2); }
.notes .card { padding: 16px 20px; }
.notes h3 { margin: 0 0 8px; color: var(--text); font-size: 15px; }
.notes ul { margin: 0; padding-left: 18px; }
.notes li + li { margin-top: 4px; }
@media (max-width: 760px) {
  .settings { grid-template-columns: 1fr; } .side { display: none; }
  .screen-head .back { position: static; justify-content: center; margin-bottom: -18px; }
  .body { padding: 14px 16px; } .footer { padding: 12px 16px; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="power" viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></symbol>

<header class="topbar">
  <h1>Redémarrage et reprise</h1>
  <p>Un entretien qui redémarre le PC en son milieu, puis reprend seul. Choisissez une scène ; les interrupteurs en dessous montrent ses variantes. Données fictives.</p>
  <div class="seg" id="scenes">
    <button type="button" data-scene="verifier" aria-pressed="true">1 · Vérifier</button>
    <button type="button" data-scene="redemarrage" aria-pressed="false">2 · Redémarrage</button>
    <button type="button" data-scene="restreint" aria-pressed="false">3 · Mode restreint</button>
    <button type="button" data-scene="bilan" aria-pressed="false">4 · Bilan</button>
    <button type="button" data-scene="interrompu" aria-pressed="false">5 · Interrompu</button>
    <button type="button" data-scene="reglage" aria-pressed="false">6 · Réglage Expert</button>
  </div>
  <div class="seg" id="theme">
    <button type="button" data-t="dark" aria-pressed="true">Sombre</button>
    <button type="button" data-t="light" aria-pressed="false">Clair</button>
  </div>
  <div class="variants" id="variants"></div>
</header>

<div class="stage"><div class="screen" id="screen"></div></div>

<section class="notes"><div class="card">
  <h3>Ce qui est réglé ici</h3>
  <ul id="notes"></ul>
</div></section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const ico = (n, cls = '') => `<svg class="ico ${cls}" aria-hidden="true"><use href="#${n}"/></svg>`;
  const LOGO = 'sindry-256.png';
  const ACTIONS = [
    { t: 'Nettoyer les fichiers temporaires', icon: 'trash', res: '1,4 Go libérés' },
    { t: 'Retirer les restes de Webroot', icon: 'bug', res: 'Pilote WRkrn retiré, 3 tâches supprimées', resume: true },
    { t: 'Vider les caches des navigateurs', icon: 'globe', res: '640 Mo libérés' },
    { t: 'Vérifier les fichiers système', icon: 'pulse', res: 'Aucune erreur trouvée', reboot: true },
  ];
  const ui = { scene: 'verifier', arso: true, admin: true, later: false, stop: 0, again: false, endOffer: true };
  let timer = null, left = 60;

  const appbar = (step) => `<div class="appbar"><img src="${LOGO}" alt=""><b>Sindry</b><span class="ver">2.1.0</span>
    <span class="steps"><span class="${step > 1 ? 'done' : 'on'}">Choisir</span><span class="${step > 2 ? 'done' : step === 2 ? 'on' : ''}">Vérifier</span><span class="${step === 3 ? 'on' : ''}">Entretien</span></span></div>`;
  const head = (title, sub) => `<div class="screen-head"><span class="back"><i>←</i>Faire le ménage</span><h2>${title}</h2><p>${sub}</p></div>`;
  const ring = (n, size = 92) => {
    const r = size / 2 - 5, c = 2 * Math.PI * r;
    return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">
      <circle class="track" cx="${size / 2}" cy="${size / 2}" r="${r}"/><circle class="bar" data-ring cx="${size / 2}" cy="${size / 2}" r="${r}"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - n / 60)}" data-c="${c}"/></svg><div class="num"><div><span data-left>${n}</span><small>s</small></div></div></div>`;
  };
  const arsoLine = (compact) => ui.arso
    ? `<span class="arso on">${ico('lock')}${compact ? 'Votre session se rouvrira seule, verrouillée' : 'Reprise sans mot de passe : activée'}</span>`
    : `<span class="arso off">${ico('info')}${compact ? 'Après le redémarrage, ouvrez votre session : Sindry reprendra' : 'Reprise sans mot de passe : désactivée'}</span>`;

  // 1. « Vérifier »: what will run, and what the restart means for the user.
  function verifier() {
    const rows = ACTIONS.map((a) => `<label class="row"><input type="checkbox" checked><span class="tile">${ico(a.icon)}</span>
      <span class="t"><b>${a.t}</b>${a.resume ? `<span class="bd reboot">${ico('power')}Redémarre le PC en cours de route</span>` : ''}${a.reboot ? `<span class="bd neutral">${ico('power')}Redémarrage à la fin</span>` : ''}</span></label>`).join('');
    const arso = ui.arso
      ? `<div class="note ok">${ico('lock')}<span class="grow"><b>Reprise sans mot de passe : activée</b>Windows rouvrira votre session et la verrouillera aussitôt ; Sindry reprendra derrière l'écran verrouillé.</span></div>`
      : `<div class="note info">${ico('info')}<span class="grow"><b>Reprise sans mot de passe : désactivée</b>Après le redémarrage, ouvrez votre session : Sindry reprendra à ce moment-là. Pour que tout se fasse sans vous, activez « Utiliser mes informations de connexion… » dans Windows.
        <span class="act" style="display:block"><button type="button" class="btn small">${ico('settings')}Ouvrir le réglage Windows</button></span></span></div>`;
    return `${appbar(2)}${head('Voici ce qui va être fait', 'Décochez ce que vous ne voulez pas lancer cette fois.')}
      <div class="body"><div class="card rows">${rows}</div>
        <div class="notes-list">
          <div class="note info">${ico('restore')}<span>Un point de restauration sera créé avant de commencer.</span></div>
          <div class="note warn">${ico('power')}<span class="grow"><b>Le PC redémarrera pendant l'entretien</b>Sindry reprendra seul, là où il en était. Enregistrez votre travail et fermez vos programmes avant de lancer.</span></div>
          ${arso}
        </div></div>
      <div class="footer"><span class="sum">4 actions<small>Environ 10 minutes, redémarrage compris</small></span><button type="button" class="btn primary">Lancer</button></div>`;
  }

  // The run in progress (step 3), behind the restart window.
  function progress(paused) {
    const st = (i) => (i === 0 ? ['ok', '✓'] : i === 1 ? [paused ? 'pause' : 'run', paused ? '❚❚' : '●'] : ['wait', '']);
    const rows = ACTIONS.map((a, i) => `<div class="row${i > 1 ? ' muted' : ''}"><span class="state ${st(i)[0]}">${st(i)[1]}</span><span class="tile">${ico(a.icon)}</span>
      <span class="t"><b>${a.t}</b><small>${i === 0 ? a.res : i === 1 ? (paused ? 'En pause : reprendra au prochain redémarrage du PC' : 'Attend le redémarrage du PC') : 'À faire'}</small></span></div>`).join('');
    return `${appbar(3)}${head('Entretien en cours', 'Laissez Sindry travailler.')}
      <div class="body">${paused ? `<div class="banner">${ico('power')}<span class="grow"><b>Entretien en pause</b>Il reprendra seul au prochain redémarrage du PC, quand vous voudrez.</span><button type="button" class="btn small primary" data-now>Redémarrer maintenant</button></div>` : ''}
        <div class="card rows">${rows}</div></div>
      <div class="footer"><span class="sum">Action 2 sur 4<small>Redémarrage 1 sur 3 au plus</small></span><button type="button" class="btn">Arrêter</button></div>`;
  }

  // 2. The restart window: 60 s, then the PC restarts — the run goes on alone.
  function redemarrage() {
    if (ui.later) return progress(true);
    return `${progress(false)}<div class="veil"><div class="modal" role="alertdialog" aria-labelledby="rt">
      ${ring(left)}
      <h3 id="rt">Redémarrage nécessaire</h3>
      <p>« Retirer les restes de Webroot » doit redémarrer le PC pour terminer. Sindry reprendra seul ensuite : <b>2 actions restantes</b>.</p>
      <p>Enregistrez votre travail : le PC redémarre à la fin du compte à rebours.</p>
      ${arsoLine(true)}
      <div class="btns"><button type="button" class="btn primary" data-now>${ico('power')}Redémarrer maintenant</button><button type="button" class="btn" data-later>Plus tard</button></div>
      <div class="foot">Redémarrage 1 sur 3 au plus pour cet entretien</div></div></div>`;
  }

  // 3. Restricted mode: only what the run needs, in a window that cannot be closed.
  function restreint() {
    const confirm = ui.stop === 1 ? `<div class="confirm"><b>Arrêter après cette action ?</b>L'action en cours se termine d'abord ; les actions suivantes ne seront pas faites.
        <div class="btns"><button type="button" class="btn small" data-stop-yes>Arrêter après cette action</button><button type="button" class="btn small primary" data-stop-no>Continuer</button></div></div>`
      : ui.stop === 2 ? `<div class="confirm"><b>Arrêt demandé</b>L'entretien s'arrêtera dès la fin de cette action, puis le bilan s'affichera.</div>` : '';
    const again = ui.again ? `<div class="mini-count">${ring(left, 64)}<div><b>Un nouveau redémarrage est nécessaire</b><small style="color:var(--text-2)">« Vérifier les fichiers système » doit redémarrer le PC.</small>
        <div class="btns"><button type="button" class="btn small primary" data-now>Redémarrer maintenant</button><button type="button" class="btn small" data-later>Plus tard</button></div></div></div>` : '';
    const job = ui.again
      ? { t: 'Vérifier les fichiers système', s: 'Action 4 sur 4 · réparation planifiée au redémarrage', w: 70, step: '[STEP] 2/3 Scheduling the repair for the next boot', dots: ['ok', 'ok', 'ok', 'run'], n: 2 }
      : { t: 'Retirer les restes de Webroot', s: 'Action 2 sur 4 · reprise après redémarrage', w: 55, step: '[STEP] 3/4 Removing the WRkrn driver file', dots: ['ok', 'run', '', ''], n: 1 };
    return `<div class="desk"><span class="lockhint">${ico('lock')} Ce que l'on voit en déverrouillant la session</span>
      <div class="win" role="dialog" aria-label="Sindry — Action en cours">
        <div class="win-title"><img src="${LOGO}" alt="">Sindry<span class="nox">ne se ferme pas pendant l'action</span></div>
        <div class="win-body">
          <div class="win-head"><img src="${LOGO}" alt=""><div><h3>Action en cours</h3><p>Merci de patienter le temps qu'elle se termine.</p></div></div>
          <div class="job"><b>${job.t}</b><small>${job.s}</small><div class="bar"><i style="width:${job.w}%"></i></div><span class="step">${job.step}</span>
            <div class="dots">${job.dots.map((d) => `<i class="${d}"></i>`).join('')}<span>Faire le ménage</span></div></div>
          ${again}${confirm}
          <div class="win-foot"><span class="grow">Redémarrage ${job.n} sur 3 au plus</span>${ui.stop ? '' : '<button type="button" class="link muted" data-stop>Arrêter…</button>'}</div>
        </div></div>
      <div class="taskbar"><i></i><i></i><i class="app"></i><span>10:46</span></div></div>`;
  }

  // 4. The summary: before and after the restart, then the final restart offer.
  function bilan() {
    const row = (a) => `<div class="row"><span class="state ok">✓</span><span class="tile">${ico(a.icon)}</span><span class="t"><b>${a.t}</b><small>${a.res}</small></span>${a.resume ? '<span class="bd ok">Repris après redémarrage</span>' : ''}</div>`;
    const offer = ui.endOffer ? `<div class="note warn" style="margin-top:14px">${ico('power')}<span class="grow"><b>Un dernier redémarrage termine le travail</b>« Vérifier les fichiers système » répare au prochain démarrage. Rien ne presse : redémarrez quand vous voulez.
        <span class="act" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn small primary">Redémarrer maintenant</button><button type="button" class="btn small" data-endlater>Plus tard</button></span></span></div>` : '';
    return `${appbar(3)}${head('C\'est terminé !', '4 actions sur 4 réussies · 2,0 Go libérés · 1 redémarrage')}
      <div class="body"><div class="card rows">${row(ACTIONS[0])}
        <div class="sep">${ico('power')}<span>Redémarrage · 10:42 → 10:45</span><span class="line"></span><span>reprise automatique</span></div>
        ${ACTIONS.slice(1).map(row).join('')}</div>${offer}</div>
      <div class="footer"><span class="sum">Fait le 24 octobre<small>Le détail technique reste dans le journal</small></span><button type="button" class="btn">Voir le détail technique</button><button type="button" class="btn primary">Terminer</button></div>`;
  }

  // 5. A manual launch finds a run interrupted (power cut, unexpected restart).
  function interrompu() {
    const rows = ACTIONS.slice(1).map((a, i) => `<div class="row" style="text-align:left"><span class="state ${i === 0 ? 'pause' : 'wait'}">${i === 0 ? '?' : ''}</span><span class="t"><b>${a.t}</b><small>${i === 0 ? 'Interrompue : sera relancée depuis le début' : 'Pas encore faite'}</small></span></div>`).join('');
    const go = ui.admin
      ? '<button type="button" class="btn primary">Reprendre</button>'
      : `<button type="button" class="btn primary">${ico('shield')}Reprendre (droits administrateur)</button>`;
    return `${appbar(1)}<div class="screen-head"><h2 style="margin-top:40px">Que souhaitez-vous faire ?</h2><p>Choisissez une option.</p></div>
      <div class="veil"><div class="modal" role="alertdialog" style="width:min(500px,100%)">
        <div class="tile" style="margin:0 auto;width:48px;height:48px;color:var(--warn)">${ico('warn')}</div>
        <h3>L'entretien précédent a été interrompu</h3>
        <p>Le 24/10 à 10:41, le PC s'est arrêté pendant « Retirer les restes de Webroot ». Trois actions n'ont pas été faites.</p>
        <div class="card rows" style="margin-top:12px">${rows}</div>
        ${ui.admin ? '' : '<p style="margin-top:10px;font-size:12px">Sindry doit se relancer en administrateur pour reprendre, comme au lancement de l\'entretien.</p>'}
        <div class="btns">${go}<button type="button" class="btn">Abandonner</button></div>
        <div class="foot">« Abandonner » oublie cet entretien ; rien n'est défait.</div></div></div>`;
  }

  // 6. The Expert setting, next to « En cas d'échec » (4. Actions).
  function reglage() {
    const n = ui.max;
    return `<div class="settings"><div class="side">
        <div><span class="num">1</span>Général</div><div><span class="num">2</span>Apparence</div><div><span class="num">3</span>Catalogues</div>
        <div class="on"><span class="num">4</span>Actions</div><div><span class="num">5</span>Avancé</div></div>
      <div class="panel"><h2><span class="num" style="font-family:var(--mono);font-size:13px;color:var(--text-3)">4</span>Actions</h2>
        <p>Comment les actions se lancent, et où vivent vos propres scripts.</p>
        <div class="card">
          <div class="setrow"><span class="lbl"><span class="num">4.1</span><span><b>En cas d'échec</b><span class="desc">Quand un script d'un lot échoue.</span></span></span><span class="select">Continuer les autres scripts ▾</span></div>
          <div class="setrow"><span class="lbl"><span class="num">4.2</span><span><b>Politique d'exécution</b><span class="desc">Ne s'applique qu'aux scripts lancés par Sindry, jamais à votre système.</span></span></span><span class="select">Bypass ▾</span></div>
          <div class="setrow"><span class="lbl"><span class="num">4.3</span><span><b>Dossier des scripts</b><span class="desc">Vos propres scripts.</span></span></span><button type="button" class="btn small">Ouvrir</button></div>
          <div class="setrow"><span class="lbl"><span class="num">4.4</span><span><b>Ré-analyser tous les scripts</b><span class="desc">Après une modification faite hors de Sindry.</span></span></span><button type="button" class="btn small">Ré-analyser</button></div>
          <div class="setrow new"><span class="lbl"><span class="num">4.5</span><span><b>Redémarrages au plus par entretien<span class="newtag">nouveau</span></b>
            <span class="desc">Au-delà, l'entretien s'arrête et le bilan dit quelle action voulait encore redémarrer. De 1 à 10.</span></span></span>
            <span class="stepper${ui.admin ? '' : ' off'}"><button type="button" data-max="-1" ${ui.admin ? '' : 'disabled'}>−</button><span>${n}</span><button type="button" data-max="1" ${ui.admin ? '' : 'disabled'}>+</button></span></div>
          ${ui.admin ? '' : `<div class="admin-note">${ico('shield')}<span class="grow">Modifiable en administrateur seulement : un programme sans droits ne doit pas pouvoir le relever.</span><button type="button" class="btn small">Relancer en administrateur</button></div>`}
          <div class="setrow new"><span class="lbl"><span class="num">4.6</span><span><b>Reprise sans mot de passe<span class="newtag">nouveau</span></b>
            <span class="desc">Un réglage de Windows : après un redémarrage, il rouvre votre session et la verrouille, pour que Sindry reprenne sans vous.</span></span></span>
            ${ui.arso ? `<span class="bd ok">${ico('check')}Activée</span>` : '<button type="button" class="btn small">Ouvrir le réglage Windows</button>'}</div>
        </div></div></div>`;
  }

  const SCENES = { verifier, redemarrage, restreint, bilan, interrompu, reglage };
  const VARIANTS = {
    verifier: [['arso', 'Reprise sans mot de passe (ARSO)']],
    redemarrage: [['arso', 'Reprise sans mot de passe (ARSO)']],
    restreint: [['again', 'Avant un nouveau redémarrage']],
    bilan: [['endOffer', 'Redémarrage demandé à la fin']],
    interrompu: [['admin', 'Lancé en administrateur']],
    reglage: [['admin', 'Lancé en administrateur'], ['arso', 'ARSO activé dans Windows']],
  };
  const NOTES = {
    verifier: ['Une action qui redémarre <b>en cours de route</b> se distingue de celle qui redémarre <b>à la fin</b>.', 'L\'état d\'ARSO se lit dans Windows (réglage de l\'utilisateur, et stratégie <code>DisableAutomaticRestartSignOn</code>). Sans lui, tout marche : la reprise attend la connexion.', 'Sindry ne demande et ne garde <b>jamais</b> le mot de passe de Windows.'],
    redemarrage: ['Le compte à rebours fait aller l\'entretien au bout sans personne devant le PC.', '« Plus tard » met l\'entretien en pause : il reprendra au prochain redémarrage, quel qu\'il soit (bannière en haut).', 'Avant d\'afficher cette fenêtre, Sindry a écrit le journal de reprise (HKLM) et créé la tâche de relance.'],
    restreint: ['Après le redémarrage, Windows rouvre la session et la <b>verrouille</b> ; Sindry travaille derrière. Voici ce qu\'on trouve en déverrouillant.', 'La fenêtre ne se ferme pas (ni croix, ni Alt+F4). « Arrêter… » laisse finir l\'action en cours, puis s\'arrête : c\'est une sortie de secours, pas une fermeture.', 'Rien d\'autre n\'est chargé : ni catalogue, ni mises à jour, ni ambiance. À la fin, l\'interface habituelle revient avec le bilan.'],
    bilan: ['Le bilan réunit ce qui s\'est fait avant et après le redémarrage, avec un séparateur.', 'Le redémarrage demandé <b>à la fin</b> (<code>[REBOOT]</code>) est proposé, jamais imposé : c\'est la promesse de la spécification §6.5, que Sindry ne tenait pas encore.'],
    interrompu: ['Un entretien coupé par surprise (panne, redémarrage imprévu) se retrouve au lancement suivant : le journal est écrit avant chaque action.', 'L\'action interrompue est relancée depuis le début ; les autres suivent. Un script modifié entre-temps est sauté, avec sa raison.'],
    reglage: ['Le plafond vit dans <code>HKLM\\SOFTWARE\\Sindry\\Reprise</code>, comme la garde : le relever affaiblit une protection, il ne s\'écrit donc qu\'en administrateur.', '3 par défaut, de 1 à 10.'],
  };
  ui.max = 3;

  function tick() {
    clearInterval(timer);
    const live = (ui.scene === 'redemarrage' && !ui.later) || (ui.scene === 'restreint' && ui.again);
    if (!live) return;
    timer = setInterval(() => {
      left = left > 1 ? left - 1 : 60;
      document.querySelectorAll('[data-left]').forEach((x) => (x.textContent = left));
      document.querySelectorAll('[data-ring]').forEach((c) => c.setAttribute('stroke-dashoffset', String(c.dataset.c * (1 - left / 60))));
    }, 1000);
  }
  function draw() {
    $('screen').innerHTML = SCENES[ui.scene]();
    $('variants').innerHTML = (VARIANTS[ui.scene] || []).map(([k, lib]) => `<label class="variant"><input type="checkbox" data-v="${k}"${ui[k] ? ' checked' : ''}>${lib}</label>`).join('');
    $('notes').innerHTML = (NOTES[ui.scene] || []).map((n) => `<li>${n}</li>`).join('');
    document.querySelectorAll('#scenes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.scene === ui.scene)));
    tick();
  }

  $('scenes').addEventListener('click', (e) => {
    const b = e.target.closest('[data-scene]'); if (!b) return;
    ui.scene = b.dataset.scene; ui.later = false; ui.stop = 0; left = 60; draw();
  });
  $('theme').addEventListener('click', (e) => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    document.documentElement.dataset.theme = b.dataset.t;
    document.querySelectorAll('#theme button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  });
  $('variants').addEventListener('change', (e) => { const k = e.target.dataset.v; if (k) { ui[k] = e.target.checked; draw(); } });
  $('screen').addEventListener('click', (e) => {
    const d = e.target.closest('button')?.dataset || {};
    if ('later' in d) ui.later = true;
    else if ('now' in d) { ui.later = false; ui.scene = 'restreint'; ui.again = false; }
    else if ('stop' in d) ui.stop = 1;
    else if ('stopYes' in d) ui.stop = 2;
    else if ('stopNo' in d) ui.stop = 0;
    else if ('endlater' in d) ui.endOffer = false;
    else if (d.max) ui.max = Math.min(10, Math.max(1, ui.max + Number(d.max)));
    else return;
    left = 60; draw();
  });
  // `#restreint`, `#redemarrage,plustard`, `#verifier,sansarso`, `#interrompu,sansdroits`, `,clair`: states for captures
  // (also `?s=restreint,encore`: headless captures of a page with an anchor come out blank).
  const etat = location.hash.slice(1) || new URLSearchParams(location.search).get('s') || '';
  const [s0, ...flags] = etat.split(',');
  if (SCENES[s0]) ui.scene = s0;
  if (flags.includes('sansarso')) ui.arso = false;
  if (flags.includes('sansdroits')) ui.admin = false;
  if (flags.includes('plustard')) ui.later = true;
  if (flags.includes('encore')) ui.again = true;
  if (flags.includes('arreter')) ui.stop = 1;
  if (flags.includes('clair')) { document.documentElement.dataset.theme = 'light'; document.querySelectorAll('#theme button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.t === 'light'))); }
  draw();
})();
</script>
</body>
</html>
