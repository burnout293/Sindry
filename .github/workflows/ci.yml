# Verification a chaque poussee.
#
# Tout tourne sous Windows : la suite de tests lance reellement PowerShell
# (execution de scripts, analyse syntaxique, verrouillage de fichier), et le
# validateur est lui-meme un script PowerShell. Un runner Linux ne prouverait
# rien de ce qui compte ici.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Une seule verification par branche : une poussee annule la precedente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Le cache porte sur target/ et sur le registre cargo : sans lui, chaque
      # verification recompile tout Tauri, ce qui prend une dizaine de minutes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Installer les dependances
        run: npm ci

      # Les icones ne sont pas versionnees (2112 fichiers) : elles se
      # regenerent depuis lucide-static, qui est une dependance npm.
      - name: Regenerer les icones
        run: npm run icons:sync

      - name: Verifier la syntaxe du frontend
        shell: bash
        run: |
          for f in src/main.js src/analyse.js src/guide.js src/i18n.js tools/bench/fixtures.js tools/bench/serve.mjs tools/sync-icons.mjs tools/verifier-presentation.mjs tools/verifier-guide.mjs tools/verifier-selection.mjs tools/archiver-maquettes.mjs tools/build-script-guides.mjs tools/markdown.mjs tools/minisign.mjs tools/build-site.mjs tools/verifier-minisign.mjs tools/build-nouveautes.mjs; do
            node --check "$f"
          done
          node tools/verifier-traductions.mjs
          # Les guides des scripts sont generes depuis FORMAT_SCRIPT.md : une
          # regle changee la-bas sans relancer le generateur fait echouer ici.
          # Une consigne pour IA changee sans son entree dans le journal
          # (SCRIPTS_POUR_IA_NOUVEAUTES.md) aussi (2.2.0).
          node tools/build-script-guides.mjs --check
          # Les nouveautes (2.4.0) : chaque version a ses notes (docs/notes), et
          # src/nouveautes.json, que l'application embarque, les suit.
          node tools/build-nouveautes.mjs --check
          # Le site (2.2.0) : sa verification de signature, puis une
          # construction hors ligne, pour qu'une page cassee se voie ici et
          # non a la publication.
          node tools/verifier-minisign.mjs
          node tools/build-site.mjs --hors-ligne --out "$RUNNER_TEMP/site"
          node tools/verifier-presentation.mjs
          node tools/verifier-guide.mjs
          # Ce que l'interface coche d'office apres une analyse : le meme calcul
          # que la ligne de commande (tools/selection-cas.json, cote Rust : le
          # test la_selection_d_office_est_celle_de_l_interface).
          node tools/verifier-selection.mjs

      # Les scripts officiels ne vivent plus ici : le depot Sindry-Catalogue les
      # valide a chaque poussee, avec ce meme validateur.

      # Les scripts complets de FORMAT_SCRIPT.md sont les modeles que l'agent
      # catalogue recopie. Un exemple que le validateur refuserait apprendrait a
      # mal ecrire : on les extrait et on les valide comme des scripts livres.
      - name: Valider les exemples de la documentation
        shell: pwsh
        run: |
          $doc = Get-Content docs/FORMAT_SCRIPT.md -Raw -Encoding UTF8
          $dir = Join-Path $env:RUNNER_TEMP 'exemples-doc'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $n = 0
          foreach ($m in [regex]::Matches($doc, '(?s)```powershell\r?\n(.*?)```')) {
            $code = $m.Groups[1].Value
            if ($code -notmatch '## SINDRY:START') { continue }
            $n++
            $f = Join-Path $dir ('{0:D3}_EXEMPLE.ps1' -f $n)
            [IO.File]::WriteAllText($f, $code, [Text.UTF8Encoding]::new($true))
          }
          Write-Host "$n exemple(s) complet(s) extrait(s)"
          if ($n -lt 2) { Write-Host '::error::moins de deux exemples complets dans FORMAT_SCRIPT.md'; exit 1 }
          ./tools/lint-scripts.ps1 -Path $dir -Strict
          # Le depot du catalogue emprunte l'outil d'index a ce depot-ci : il
          # s'eprouve donc ici, sur les memes exemples.
          ./tools/construire-index-catalogue.ps1 -Scripts $dir -Version 0.0.0 -Sortie (Join-Path $env:RUNNER_TEMP 'index-exemples.json')

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --lib --all-targets -- -D warnings

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      # Chaque bibliotheque compilee figure dans THIRD-PARTY-NOTICES.md : 46
      # avaient manque entre la 1.1 et la 1.2 sans que rien ne le signale.
      - name: Composants tiers mentionnes
        run: node tools/verifier-mentions-tierces.mjs

      # `--lib` seulement : le binaire porte un manifeste `asInvoker` et n'a
      # aucun test ; c'est la bibliotheque qui contient toute la logique.
      - name: Tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Construire l'installeur
        run: npm run build
