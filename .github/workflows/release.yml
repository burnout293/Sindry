# Publication d'une version.
#
#   git tag v4.0.1 && git push origin v4.0.1
#   git tag v1.6.0-beta && git push origin v1.6.0-beta   (pre-version)
#
# Produit l'installeur NSIS, publie la Release et y joint l'empreinte SHA-256 :
# l'executable n'etant pas signe, c'est le seul moyen offert a quelqu'un de
# verifier ce qu'il telecharge (voir le README, section SmartScreen).
name: Release

on:
  push:
    tags: ['v*']

# Necessaire pour que l'action puisse creer la Release.
permissions:
  contents: write

jobs:
  publier:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run icons:sync

      # Le modele NSIS derive de celui de Tauri (page de desinstallation de
      # Sindry, effacement sur) : tauri-action ne passe pas par `npm run build`.
      - name: Preparer le modele de l'installeur
        run: node tools/modele-installeur.mjs

      # Sans elle, build.rs compile une cle vide : l'application refuserait tout
      # catalogue, et une installation neuve ne saurait rien faire. On ne publie
      # pas une telle version.
      - name: Verifier la cle publique du catalogue
        shell: pwsh
        run: |
          $f = 'src-tauri/catalogue.pub'
          if (-not (Test-Path $f) -or -not (Get-Content $f -Raw).Trim()) {
            Write-Host "::error title=Cle du catalogue absente::$f manque : cette version ne saurait verifier aucun catalogue. La generer avec tools/generer-cle-signature.ps1 -Cible catalogue."
            exit 1
          }

      # Avant de construire : les secrets de signature sont-ils la, bien formes,
      # et conformes a la cle publique compilee dans l'application ? Sinon la
      # construction echouerait au bout de dix minutes sur « exit code 1 » — ou
      # pire, signerait avec une cle que chaque installation refuserait. Chaque
      # echec sort en annotation, lisible sans fouiller le journal.
      - name: Verifier la cle de signature
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./tools/verifier-cle-signature.ps1

      # On ne publie pas ce qui n'a pas passe les tests, meme si la CI est
      # deja verte sur la branche : le tag peut pointer ailleurs.
      - name: Tests
        working-directory: src-tauri
        run: cargo test --lib

      # On ne publie pas une version dont les mentions de composants tiers sont
      # incompletes : c'est une obligation de licence, pas une documentation.
      - name: Composants tiers mentionnes
        run: node tools/verifier-mentions-tierces.mjs

      - name: Construire et publier
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature de la mise a jour automatique (§11). La cle et son mot de
          # passe arrivent par GITHUB_ENV, ecrits par l'etape « Verifier la cle
          # de signature » apres nettoyage : un copier-coller y laisse souvent un
          # saut de ligne que tauri refuse. NE PAS remettre ici les secrets
          # bruts — ils ecraseraient les valeurs nettoyees, et la release 1.1.0
          # a deja echoue exactement ainsi.
        with:
          # La signature n'est activee que pour la release : en local et en CI
          # ordinaire, `npm run build` n'a pas a connaitre la cle privee.
          args: --config src-tauri/tauri.release.json
          tagName: ${{ github.ref_name }}
          releaseName: 'Sindry ${{ github.ref_name }}'
          releaseDraft: true
          # latest.json, le manifeste que chaque installation interroge. Il
          # n'est servi qu'une fois la release PUBLIEE : tant qu'elle reste en
          # brouillon, personne ne recoit la mise a jour. Publier le brouillon,
          # c'est la livrer.
          includeUpdaterJson: true
          # Un tag avec un suffixe (v1.6.0-beta) donne une PRE-VERSION : GitHub
          # ne la compte pas dans releases/latest, l'adresse que l'updater
          # interroge. Les installations ne la recoivent donc pas ; on
          # l'installe a la main. Decocher « pre-release » sur GitHub suffit
          # ensuite a la livrer a tous, sans reconstruire.
          prerelease: ${{ contains(github.ref_name, '-') }}
          releaseBody: |
            ## Installation

            Telechargez l'installeur ci-dessous et executez-le.

            **« Windows a protege votre PC » apparaitra** : Sindry n'est pas
            signe numeriquement. Cliquez sur **Informations complementaires**,
            puis **Executer quand meme**. Voir le README pour le detail.

            ### Verifier ce que vous telechargez

            ```powershell
            Get-FileHash .\Sindry_*_x64-setup.exe -Algorithm SHA256
            ```

            Comparez avec l'empreinte publiee dans le commentaire ci-dessous.

      # 2.4.0 : la version portable, jointe a la release : les memes binaires,
      # et le marqueur qui fait de leur dossier une version portable
      # (src-tauri/src/portable.rs). Son empreinte rejoint empreintes.txt.
      - name: Joindre la version portable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/construire-portable.ps1 -Version '${{ github.ref_name }}' -ReleaseId '${{ steps.tauri.outputs.releaseId }}'

      - name: Publier l'empreinte de l'installeur
        shell: pwsh
        run: |
          $installeurs = @(Get-ChildItem -Recurse -Path src-tauri/target/release/bundle -Filter *-setup.exe)
          if ($installeurs.Count -eq 0) {
            Write-Host "::warning::aucun installeur trouve, empreinte non publiee"
            exit 0
          }
          foreach ($f in $installeurs) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
            Write-Host "::notice::$($f.Name) : $h"
            Add-Content -Path empreintes.txt -Value "$($f.Name)  SHA256  $h"
          }

      - uses: actions/upload-artifact@v6
        with:
          name: empreintes
          path: empreintes.txt
          if-no-files-found: ignore
